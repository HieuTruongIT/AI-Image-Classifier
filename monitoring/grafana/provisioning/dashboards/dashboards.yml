# Grafana Dashboard Provisioning
# Auto-loads the VisionScale dashboard

apiVersion: 1

providers:
  - name: "VisionScale Dashboards"
    orgId: 1
    folder: ""
    folderUid: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
